[package]
name = "common"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/mod.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
macaddr = "1.0"
heapless = { version = "0.9.3", features = ["serde"] }
bincode = { version = "2.0", default-features = false, features = ["std", "serde"] }
serde-big-array = "0.5"
